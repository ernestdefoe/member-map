ernestdefoe-member-map:
  admin:
    widget: Wo wir sind
    permissions:
      view: Mitgliederkarte ansehen
      list: Auf der Mitgliederkarte erscheinen
      travel: Reise-Pins auf der Mitgliederkarte setzen
      meetup: Treffen auf der Mitgliederkarte planen
    settings:
      nav: Link zur Mitgliederkarte in der Seitenleiste des Forums anzeigen
      profile: Mitgliedern erlauben, ihren Ort im Profil und auf der Nutzerkarte zu zeigen
      distance_units: Entfernungen anzeigen in
      distance_units_help: "Wird für die groben Entfernungen unter „In deiner Nähe“ verwendet. „Automatisch“ richtet sich nach dem Browser des Mitglieds: Meilen in den USA, im Vereinigten Königreich, in Liberia und Myanmar, sonst Kilometer. Ein Browser mit amerikanischem Englisch schätzt überall auf Meilen. Wähle daher eine Einheit, wenn deine Community eine bestimmte nutzt."
      distance_units_auto: Automatisch (nach dem Browser des Mitglieds)
      distance_units_km: Kilometer
      distance_units_mi: Meilen
      jitter: Mitglieder innerhalb ihrer Stadt leicht streuen
      jitter_help: "Mitglieder, die „Stadt“ gewählt haben, werden um bis zu etwa 3 km vom Stadtzentrum versetzt, und zwar immer gleich. So stapeln sich in einer großen Stadt nicht alle auf einem Punkt."
      trip_radius_km: Mitglieder im Umkreis von so vielen Kilometern über eine Reise informieren
      trip_radius_km_help: "Mitglieder, die so nah an einem Reiseziel wohnen, bekommen die Benachrichtigung „Besuch in deiner Nähe“. Standard 160 km (etwa 100 Meilen); 10 bis 1.000."
      trip_max_alerts: Höchstzahl der Mitglieder, die über eine Reise informiert werden
      trip_max_alerts_help: "Zuerst die am nächsten wohnenden Mitglieder. Standard 50; 1 bis 200."
      allow_indexing: Suchmaschinen erlauben, die Kartenseite zu indexieren
      allow_indexing_help: "Standardmäßig aus: Die Seite bittet Suchmaschinen, sie nicht zu indexieren. Daten von Mitgliedern gehen in keinem Fall an Suchmaschinen."
      meetup_tag: Tag für Treffen-Diskussionen
      meetup_tag_none: Tag wählen
      meetup_tag_help: Jedes Treffen legt eine Diskussion an. Bei aktivierten Tags brauchen Mitglieder die Berechtigung für dieses Tag, um ein Treffen zu planen.
      style_url: Adresse des Kartenstils
      style_url_help: "Ein MapLibre-Vektorstil. Leer lassen, um stattdessen die Kachel-Adresse weiter unten zu verwenden. Der Standard OpenFreeMap ist kostenlos und braucht keinen Schlüssel."
      style_dark_url: Adresse des Kartenstils im dunklen Modus
      style_dark_url_help: Optional. Wird verwendet, wenn das Forum dunkel ist. Leer lassen, um den Stil von oben zu verwenden.
      tiles_url: Adresse der Kartenkacheln
      tiles_url_help: "Bildkacheln, wenn der Stil oben leer ist oder nicht geladen werden kann, und für die kleine Karte im Profil. Leer lassen für OpenStreetMap, das keinen Schlüssel braucht."
      attribution: Quellenangabe der Karte
      attribution_help: "Die Quellenangabe, die bei den Bildkacheln angezeigt wird. Die meisten Kartenanbieter verlangen sie. Einfache HTML-Links sind erlaubt."
      geocoder_url: Adresse der Ortssuche
      geocoder_url_help: "Leer lassen für den kostenlosen Nominatim-Dienst von OpenStreetMap. Jeder Dienst mit derselben API funktioniert, etwa ein eigener Nominatim-Server oder LocationIQ. Die Suche läuft auf deinem Server, höchstens einmal pro Sekunde, und jede Antwort wird 30 Tage gespeichert."
      geocoder_key: API-Schlüssel der Ortssuche
      geocoder_key_help: Optional. Nur für Dienste, die einen Schlüssel verlangen. Er wird nie an Browser gesendet.
      geocoder_email: Kontakt-E-Mail für die Ortssuche
      geocoder_email_help: "Optional. Nominatim bittet stark genutzte Seiten um eine Adresse, an die es sich bei Problemen wenden kann."

